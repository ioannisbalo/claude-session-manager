<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <title>Claude Session Manager</title>
  <link rel="stylesheet" href="../../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="sidebar-title">Sessions</span>
        <button id="rename-session-btn" title="Rename selected session">&#9998;</button>
      </div>
      <ul id="session-list"></ul>
      <button id="new-session-btn">+ New Session</button>
      <div id="sidebar-resizer"></div>
    </aside>
    <main id="terminal-container">
      <div id="terminal-panel"></div>
      <div id="empty-state">
        <p>No session selected</p>
        <p class="hint">Click "+ New Session" to start</p>
      </div>
    </main>
  </div>
  <div id="task-modal" hidden>
    <div id="task-modal-backdrop"></div>
    <div id="task-modal-panel" role="dialog" aria-modal="true" aria-labelledby="task-modal-heading">
      <h2 id="task-modal-heading">New task</h2>

      <label for="task-modal-title">Title</label>
      <input id="task-modal-title" type="text" autocomplete="off">

      <label for="task-modal-description">Description</label>
      <textarea id="task-modal-description" rows="4"></textarea>

      <label for="task-modal-type">Type</label>
      <select id="task-modal-type">
        <option value="">No type</option>
        <option value="feature">Feature</option>
        <option value="bug">Bug</option>
        <option value="chore">Chore</option>
        <option value="review">Review</option>
        <option value="spike">Spike</option>
      </select>

      <label>Repos</label>
      <ul id="task-modal-repos" class="task-modal-list"></ul>
      <button id="task-modal-add-repo" type="button" class="task-modal-add">Add…</button>

      <label>Links</label>
      <ul id="task-modal-links" class="task-modal-list"></ul>
      <button id="task-modal-add-link" type="button" class="task-modal-add">Add…</button>
      <input id="task-modal-link-input" type="text" placeholder="https://…" hidden>

      <div id="task-modal-actions">
        <button id="task-modal-cancel" type="button">Cancel</button>
        <button id="task-modal-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="../../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="terminal.js"></script>
  <script src="app-state-logic.js"></script>
  <script src="appState.js"></script>
  <script src="app.js"></script>
</body>
</html>
